name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # The floor declared in `engines`, and a current LTS.
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # The package ships `dist`. A typecheck proves the source is sound; only
      # a build proves there is something to publish.
      - run: npm run build

      # The README leads with a cost table. If the package stops producing it,
      # the number in the README is a claim nobody checked.
      - run: npm run simulate
